[project]
name = "ha-foodsharing"
version = "2026.8.1-dev0"
description = "Foodsharing Custom Component for Home Assistant"
readme = "README.md"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "SIM102", "SIM105", "SIM117", "E402", "B017", "B904", "ARG001", "RUF012", "DTZ003", "DTZ007", "DTZ001", "DTZ005", "BLE001", "S110", "S112"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", "testing_config"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:homeassistant.*",
    "ignore::DeprecationWarning:aiohttp.*",
]

[tool.mypy]
explicit_package_bases = true
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    "tests"
]
